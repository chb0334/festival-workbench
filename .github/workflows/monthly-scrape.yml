# 节日产品图库 · 每月 30 号自动采集（方案 B：GitHub 定时 + Pages 自动上线）
# ============================================================
# 流程：每月 30 号 → 采集 → 合并进 index.html → 提交仓库
#       → GitHub Pages 自动重新部署 → 线上页面自己更新（无需手动发布）
#
# 前提（详见仓库根 README）：
#   1. 本仓库已开启 GitHub Pages（Settings → Pages → Source: Deploy from a branch → main → /root）
#   2. 亚马逊硬证据需配置密钥：Settings → Secrets → 添加
#      AMAZON_PA_API_KEY / AMAZON_PA_API_SECRET，否则亚马逊分支自动跳过。
#   3. 西柚洞察（xydc.com）热销榜需登录态：Settings → Secrets → 添加
#      XIYOU_COOKIE（微信扫码登录后的 Cookie 字符串），否则西柚分支自动跳过。
#   3. cron 已设为每月 28 号（覆盖 2 月，避免"2 月没有 30 号"导致漏跑）。
#   4. GitHub 在仓库 60 天无活动后会暂停定时任务，跑一次或 push 一下即恢复。

name: monthly-festival-scrape

on:
  schedule:
    - cron: "0 18 28 * *"        # 每月 28 号 18:00 UTC（≈北京时间次日凌晨 2:00，覆盖 2 月）
  workflow_dispatch:              # 也支持在 Actions 页面手动点一下立即运行

permissions:
  contents: write                 # 允许工作流把更新提交回仓库

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests beautifulsoup4

      - name: 采集当月数据
        env:
          AMAZON_PA_API_KEY: ${{ secrets.AMAZON_PA_API_KEY }}
          AMAZON_PA_API_SECRET: ${{ secrets.AMAZON_PA_API_SECRET }}
          AMAZON_LIMIT: ${{ vars.AMAZON_LIMIT }}
          XIYOU_COOKIE: ${{ secrets.XIYOU_COOKIE }}
        run: |
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)
          python3 scrape_month.py --year "$YEAR" --month "$MONTH"

      - name: 合并进工作台（index.html）
        run: python3 merge_month.py $(date -u +%Y)-$(date -u +%m) --html index.html

      - name: 提交更新（Pages 会自动重新部署）
        run: |
          git config user.name "festival-bot"
          git config user.email "bot@workbuddy.local"
          git add index.html "节日工作台数据库/"
          git commit -m "chore: 自动采集 $(date -u +%Y-%m)" || echo "无变化，跳过"
          git push
