<style data-page-node-id="My4LvOdKjvXiz6yx4U38TP" data-pnid-children="2MhI8DUKCJuhGn3UmGyVaj">
:root{
  --paper:#f6f4ef; --paper-2:#efece5; --surface:#ffffff;
  --ink:#1e1c19; --ink-2:#55504a; --ink-3:#8c857a;
  --line:#e2ddd3; --line-2:#cfc8bb;
  --accent:#9a3412; --accent-soft:#fbeee4; --accent-2:#b45309;
  --ok:#1c6b52; --ok-soft:#e7f2ec;
  --shadow:0 1px 2px rgba(30,28,25,.04),0 6px 18px rgba(30,28,25,.05);
  --shadow-lg:0 12px 48px rgba(30,28,25,.18);
  --serif:"Noto Serif SC","Songti SC",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.01em}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit}
/* 顶栏 */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{width:38px;height:38px;border-radius:9px;background:var(--accent);color:#fff;font-family:var(--serif);font-size:20px;display:flex;align-items:center;justify-content:center}
.brand h1{font-size:18px}
.brand p{margin:1px 0 0;font-size:12px;color:var(--ink-3)}
.top-stats{display:flex;gap:14px}
.top-stats .ts{text-align:center;padding:0 10px}
.top-stats .ts b{display:block;font-size:18px;font-family:var(--serif);color:var(--accent)}
.top-stats .ts span{font-size:11px;color:var(--ink-3)}
/* scope bar */
.scopebar{display:flex;flex-wrap:wrap;gap:18px;padding:10px 22px;background:var(--paper-2);border-bottom:1px solid var(--line)}
.scope-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.scope-label{font-size:12px;color:var(--ink-3);font-weight:600}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;transition:.12s}
.chip:hover{border-color:var(--ink-3)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.chip .n{font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.vertical{flex-direction:column;align-items:stretch}
.chips.vertical .chip{justify-content:space-between}
.chips.vertical .chip.zero{opacity:.42}
/* layout */
.layout{display:flex;gap:0;min-height:calc(100vh - 108px)}
.sidebar{width:230px;flex-shrink:0;padding:16px 14px;border-right:1px solid var(--line);background:var(--surface);position:sticky;top:108px;align-self:flex-start;max-height:calc(100vh - 108px);overflow-y:auto}
.searchbox{margin-bottom:14px}
.searchbox input{width:100%;border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;font-size:13px;background:var(--paper)}
.searchbox input:focus{outline:2px solid #e7d3c2;border-color:var(--accent-2)}
.filter-block{margin-bottom:16px}
.filter-block h3{font-size:12px;color:var(--ink-3);margin-bottom:7px;text-transform:uppercase;letter-spacing:.04em}
.checkline{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);margin:6px 0;cursor:pointer}
.checkline input{accent-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer;transition:.12s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;font-size:12.5px}
.btn.block{width:100%;margin-top:8px}
/* main */
.main{flex:1;min-width:0;padding:18px 22px}
.summary-bar{display:flex;flex-wrap:wrap;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 18px;margin-bottom:14px}
.sum-num b{font-size:26px;font-family:var(--serif);color:var(--accent)}
.sum-num span{font-size:13px;color:var(--ink-3);margin-left:3px}
.sum-scope{font-size:12px;color:var(--ink-3)}
.sum-metrics{display:flex;gap:22px;flex:1}
.sm .k{display:block;font-size:11px;color:var(--ink-3)}
.sm .v{font-size:14px;font-weight:600}
.sm .v b{color:var(--ok)}
.sm .v em{font-style:normal;color:var(--ink-3);font-size:12px;margin-left:4px}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.result-info{font-size:13px;color:var(--ink-2)}
.toolbar-right{display:flex;align-items:center;gap:12px}
select{border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;font-size:13px;background:var(--surface);color:var(--ink-2)}
.density{display:flex;gap:4px}
.density button{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;width:30px;height:30px;cursor:pointer;color:var(--ink-3)}
.density button.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-2);font-weight:700}
/* grid */
.grid{column-count:4;column-gap:14px}
.grid.density-l{column-count:3}
.grid.density-m{column-count:4}
.grid.density-s{column-count:5}
.card{display:inline-block;width:100%;margin:0 0 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;break-inside:avoid;cursor:pointer;transition:.15s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--line-2)}
.card-img{position:relative;overflow:hidden;background:#f1efe9}
.card-img img{display:block;width:100%;height:auto}
.badge-ev,.badge-plat{position:absolute;font-size:11px;border-radius:5px;padding:2px 7px;color:#fff;font-weight:600;line-height:1.4}
.badge-ev{left:8px;top:8px;background:var(--ok);max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge-ev.none{background:#5a544b;font-weight:400}
.badge-plat{right:8px;top:8px;background:rgba(30,28,25,.72)}
.badge-pending{position:absolute;right:8px;bottom:8px;background:#d97706;color:#fff;font-size:11px;border-radius:5px;padding:2px 7px;font-weight:600}
/* 悬浮详情浮层 */
.card-hover{position:absolute;left:0;right:0;bottom:0;background:rgba(20,17,14,.88);color:#f5f2ec;padding:9px 11px;font-size:11.5px;line-height:1.6;transform:translateY(102%);transition:transform .18s ease;max-height:78%;overflow-y:auto}
.card:hover .card-hover,.card:focus-within .card-hover{transform:translateY(0)}
.hv-row{display:flex;gap:5px}
.hv-k{flex-shrink:0;color:#e8b17a;font-weight:600;min-width:30px}
.hv-v{color:#f5f2ec;word-break:break-all}
.hv-ev{margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,.22);color:#8fe0c0;font-weight:600}
.card-body{padding:7px 10px 9px}
.card-title{font-size:13px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.empty{text-align:center;padding:70px 20px;color:var(--ink-3)}
.empty .empty-mark{font-size:40px;color:var(--line-2)}
.empty h2{font-family:var(--serif);color:var(--ink-2);margin:8px 0 4px}
/* 灯箱 */
.modal{position:fixed;inset:0;z-index:50;display:flex}
.modal[hidden]{display:none}
.lb-backdrop{position:absolute;inset:0;background:rgba(20,17,14,.55)}
.lb-body{position:relative;margin:auto;width:min(1080px,94vw);max-height:92vh;background:var(--surface);border-radius:14px;display:flex;overflow:hidden;box-shadow:var(--shadow-lg)}
.lb-close{position:absolute;right:12px;top:10px;z-index:3;border:none;background:rgba(30,28,25,.12);color:#fff;width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer;line-height:1}
.lb-left{flex:1.15;background:#eceae4;display:flex;align-items:center;justify-content:center;min-height:320px}
.lb-left img{max-width:100%;max-height:90vh;display:block;object-fit:contain}
.lb-right{flex:1;padding:22px 22px;overflow-y:auto}
.chip-static{display:inline-block;font-size:11.5px;border-radius:5px;padding:2px 8px;margin-right:6px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip-static.soft{background:var(--paper-2);color:var(--ink-2);font-weight:400}
.lb-right h2{font-size:19px;margin:12px 0 10px;line-height:1.35}
.evidence-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--ok-soft)}
.evidence-card .ec-k{font-size:11px;color:var(--ink-3)}
.evidence-card .ec-v{font-size:22px;font-weight:700;color:var(--ok);font-family:var(--serif)}
.evidence-card .ec-n{font-size:12px;color:var(--ink-2);margin-top:2px}
.evidence-card.empty-ev{background:var(--paper-2)}
.evidence-card.empty-ev .ec-v{color:var(--ink-3);font-size:16px}
.meta-list{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0;font-size:12.5px}
.meta-list dt{color:var(--ink-3)}
.meta-list dd{margin:0;color:var(--ink-2);word-break:break-all}
.lb-tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.tag{font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 7px}
.lb-note{font-size:13px;color:var(--ink-2);background:var(--paper);border-left:3px solid var(--accent-2);padding:8px 11px;border-radius:4px;margin:10px 0}
.lb-actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:860px){
  .layout{flex-direction:column}
  .sidebar{width:100%;position:static;max-height:none;border-right:none;border-bottom:1px solid var(--line)}
  .lb-body{flex-direction:column}
  .lb-left{min-height:240px}
  .grid{column-count:2}
}
/* ===== 视觉与交互打磨 ===== */
/* 卡片悬停：图片微缩放 + 标题高亮 + 焦点可访问性 */
.card-img img{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.card:hover .card-img img{transform:scale(1.06)}
.card:hover .card-title{color:var(--accent)}
.card{cursor:pointer}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
/* 入场级联动画（替代骨架屏观感） */
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.grid .card{animation:cardIn .42s ease both;animation-delay:calc(var(--i,0)*.022s)}
@media (prefers-reduced-motion: reduce){.grid .card{animation:none}}
/* 证据强度可视化（热力点） */
.ev-meter{display:flex;align-items:center;gap:4px;margin-top:8px}
.ev-meter .dot{width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none}
.ev-meter .lbl{font-size:10px;color:var(--ink-3);margin-left:4px;letter-spacing:.02em;white-space:nowrap}
/* 空状态插画与按钮 */
.empty{display:flex;flex-direction:column;align-items:center}
.empty svg{width:128px;height:100px;margin-bottom:4px}
.empty .btn{margin-top:16px}
/* 顶栏/汇总栏轻微质感 */
.topbar{box-shadow:0 1px 0 var(--line)}
.summary-bar{box-shadow:var(--shadow)}
/* 暗色模式细节补全 */
@media (prefers-color-scheme: dark){
  :root{
    --paper:#17150f;--paper-2:#211e18;--surface:#261f17;--ink:#ece7df;--ink-2:#b6afa4;
    --ink-3:#8a8276;--line:#3a342c;--line-2:#4b4339;--accent:#e07a4a;--accent-soft:#3a241a;
    --accent-2:#f0a062;--ok:#4fb38c;--ok-soft:#16302a;
  }
  .card-img{background:#2c271f}
  .lb-left{background:#2c271f}
  .searchbox input{background:#2c271f}
  .card-hover{background:rgba(10,8,5,.92)}
  .badge-plat{background:rgba(10,8,5,.7)}
  .evidence-card{color:var(--ink)}
  .evidence-card .ec-v{color:#5fc79e}
}
</style>
</head>

var CFG = {"target_per_person": 50, "years": ["2024", "2025", "2026", "2027"], "holidays": ["万圣节", "感恩节", "圣诞节", "复活节", "情人节", "独立日", "其他"], "platforms": ["亚马逊", "独立站", "Pinterest", "TikTok", "Facebook", "Instagram", "Etsy", "其他"], "design_types": ["盘子实拍图", "素材图", "平面设计稿", "包装周边", "场景图"], "evidence_types": ["月销量", "评论数", "点赞", "收藏", "转发", "Best Seller排名", "无"], "members": ["运营", "美工"]};

var state = { filters:{year:"",holiday:"",platform:"",design_type:"",evidence_type:"",collected_by:"",month:"",q:"",has_evidence:false,pending:false}, sort:"heat", density:"m", items:[], current:null };

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uniq(a){return Array.from(new Set(a.filter(Boolean)));}
function monthOf(d){var m=/(\d{4})-(\d{2})/.exec(d.collected_at||"");return d.month || (m?parseInt(m[2],10)+"月":"未标注");}
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.from((r||document).querySelectorAll(s));}

/* 排序：证据强度（复刻后端分级） */
function heatRank(it){ return [it.tier||0, it.heat||0]; }
function sortItems(list){
  var arr = list.slice();
  var s = state.sort;
  if(s==="heat") arr.sort(function(a,b){var x=heatRank(a),y=heatRank(b);return y[0]-x[0]||y[1]-x[1]||(a.id-b.id);});
  else if(s==="new") arr.sort(function(a,b){return String(b.collected_at||"").localeCompare(String(a.collected_at||""));});
  else if(s==="old") arr.sort(function(a,b){return String(a.collected_at||"").localeCompare(String(b.collected_at||""));});
  else if(s==="platform") arr.sort(function(a,b){return String(a.platform||"").localeCompare(String(b.platform||"","zh"));});
  else if(s==="person") arr.sort(function(a,b){return String(a.collected_by||"").localeCompare(String(b.collected_by||"","zh"));});
  return arr;
}
function matches(it){
  var f=state.filters;
  if(f.year && it.year!==f.year) return false;
  if(f.holiday && it.holiday!==f.holiday) return false;
  if(f.month && monthOf(it)!==f.month) return false;
  if(f.platform && it.platform!==f.platform) return false;
  if(f.design_type && it.design_type!==f.design_type) return false;
  if(f.evidence_type && it.evidence_type!==f.evidence_type) return false;
  if(f.collected_by && it.collected_by!==f.collected_by) return false;
  if(f.has_evidence && !(it.evidence_type && it.evidence_type!=="无" && it.evidence_value)) return false;
  if(f.pending && it.review_status!=="待人工审核") return false;
  if(f.q){var q=f.q.toLowerCase();var hay=[it.title,it.tags,it.brand,it.asin,it.note,it.holiday_reason,it.material,it.color,it.composition].filter(Boolean).join(" ").toLowerCase();if(hay.indexOf(q)<0)return false;}
  return true;
}
function refresh(){
  state.items = sortItems(DATA.filter(matches));
  renderSummary(); renderGrid(); buildSidebar();
}
function buildScope(){
  var curYear=new Date().getFullYear();
  var years = uniq(DATA.map(function(d){return d.year;})).sort(function(a,b){return String(b).localeCompare(String(a));});
  var order = CFG.holidays||[];
  var holidays = uniq(DATA.map(function(d){return d.holiday;})).sort(function(a,b){var ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});
  $("#yearChips").innerHTML = ["全部"].concat(years).map(function(y){var v=y==="全部"?"":y;return '<button class="chip '+(state.filters.year===v?"active":"")+'" data-scope="year" data-v="'+esc(v)+'">'+esc(y)+'</button>';}).join("");
  $("#holidayChips").innerHTML = ["全部"].concat(holidays).map(function(h){var v=h==="全部"?"":h;return '<button class="chip '+(state.filters.holiday===v?"active":"")+'" data-scope="holiday" data-v="'+esc(v)+'">'+esc(h)+'</button>';}).join("");
  var months = uniq(DATA.map(monthOf)).sort(function(a,b){var na=parseInt((a||"0").replace(/[^0-9]/g,""),10)||0, nb=parseInt((b||"0").replace(/[^0-9]/g,""),10)||0;return na-nb;});
  $("#monthChips").innerHTML = ["全部"].concat(months).map(function(mo){var v=mo==="全部"?"":mo;return '<button class="chip '+(state.filters.month===v?"active":"")+'" data-scope="month" data-v="'+esc(v)+'">'+esc(mo)+'</button>';}).join("");
}
function counts(key){
  var m={};
  DATA.forEach(function(d){var v=d[key]||"未填";m[v]=(m[v]||0)+1;});
  return m;
}
function buildSidebar(){
  var groups=[["platform","platformChips"],["design_type","typeChips"],["evidence_type","evidenceChips"],["collected_by","personChips"]];
  groups.forEach(function(g){
    var key=g[0], el=g[1], m=counts(key);
    var opts = uniq(["全部"].concat(Object.keys(m)));
    // 平台栏固定保留这两个平台入口（暂无数据时显示 0，采到数据后自动累加）
    if(key==="platform"){ ["花瓣网","西柚平台"].forEach(function(p){ if(opts.indexOf(p)<0) opts.push(p); }); }
    $("#"+el).innerHTML = opts.map(function(v){
      var val=v==="全部"?"":v, n=v==="全部"?DATA.length:(m[v]||0);
      var cls=["chip",state.filters[key]===val?"active":"",n===0&&v!=="全部"?"zero":""].filter(Boolean).join(" ");
      return '<button class="'+cls+'" data-filter="'+key+'" data-v="'+esc(val)+'"><span>'+esc(v)+'</span><span class="n">'+n+'</span></button>';
    }).join("");
  });
}
function renderSummary(){
  var total=state.items.length, all=DATA.length;
  var withEv=DATA.filter(function(d){return d.evidence_type&&d.evidence_type!=="无"&&d.evidence_value;}).length;
  var pct=all?Math.round(withEv/all*100):0;
  var plat=counts("platform"); var platText=Object.keys(plat).map(function(k){return k+" "+plat[k];}).join(" · ");
  $("#summaryBar").innerHTML =
    '<div><div class="sum-num"><b>'+total+'</b><span>张</span></div><div class="sum-scope">'+esc((state.filters.holiday||"全部节日")+" · "+(state.filters.year||"全部年份")+" · "+(state.filters.month||"全部月份"))+(total===all?"":'　·　全库 '+all)+'</div></div>'+
    '<div class="sum-metrics">'+
    '<div class="sm"><span class="k">平台分布</span><span class="v">'+esc(platText||"—")+'</span></div>'+
    '<div class="sm"><span class="k">证据覆盖</span><span class="v"><b>'+pct+'%</b><em>'+withEv+'/'+all+'</em></span></div>'+
    '</div>';
  $("#topStats").innerHTML =
    '<div class="ts"><b>'+all+'</b><span>图片总数</span></div>'+
    '<div class="ts"><b>'+pct+'%</b><span>证据覆盖</span></div>'+
    '<div class="ts"><b>'+uniq(DATA.map(function(d){return d.platform;})).length+'</b><span>平台</span></div>';
}
function renderGrid(){
  $("#grid").className="grid density-"+state.density;
  $("#resultCount").textContent=state.items.length;
  $("#emptyState").hidden=state.items.length>0;
  $("#grid").innerHTML = state.items.map(function(it,i){
    var hasEv = it.evidence_type && it.evidence_type!=="无" && it.evidence_value;
    var evText = hasEv ? (it.evidence_type+" "+it.evidence_value) : "无证据";
    var pending = it.review_status==="待人工审核";
    var sub = [it.price, it.design_type].filter(Boolean).join(" · ");
    var tier = it.tier||0;
    var ec = tier>=5?"#1c6b52":tier===4?"#2f9e74":tier===3?"#b45309":tier===2?"#d97706":tier===1?"#8c857a":"#b9b2a8";
    var meter = '<div class="ev-meter">';
    for(var k=1;k<=5;k++){ meter += '<span class="dot'+(k<=tier?" on":"")+'"'+(k<=tier?' style="background:'+ec+'"':"")+'></span>'; }
    meter += '<span class="lbl">证据强度 '+(tier||"—")+'/5</span></div>';
    var src = it.thumb || it.img;
    var img = src ? '<img src="'+esc(src)+'" alt="'+esc(it.title||"")+'" loading="lazy" />' : '<div style="height:140px"></div>';
    /* 悬浮详情：理由/材质/颜色/组成 + 证据 */
    var hv = '<div class="card-hover">';
    var rows = [["理由",it.holiday_reason],["材质",it.material],["颜色",it.color],["组成",it.composition]];
    rows.forEach(function(r){ if(r[1]) hv += '<div class="hv-row"><span class="hv-k">'+esc(r[0])+'</span><span class="hv-v">'+esc(r[1])+'</span></div>'; });
    hv += '<div class="hv-ev">'+(hasEv?esc(evText):"证据：无（待补充）")+'</div></div>';
    return '<article class="card" data-id="'+it.id+'" style="--i:'+Math.min(i,30)+'">'+
      '<div class="card-img">'+img+
      '<span class="badge-ev'+(hasEv?"":" none")+'">'+esc(evText)+'</span>'+
      '<span class="badge-plat">'+esc(it.platform||"未填")+'</span>'+
      (pending?'<span class="badge-pending">待审核</span>':"")+
      hv+'</div>'+
      '<div class="card-body"><div class="card-title" title="'+esc(it.title||"")+'">'+esc(it.title||"（未命名）")+'</div>'+
      (sub?'<div class="card-sub">'+esc(sub)+'</div>':"")+meter+'</div></article>';
  }).join("");
}
function openLightbox(id){
  var it=DATA.find(function(x){return x.id===id;}); if(!it)return;
  state.current=it;
  $("#lbImage").src=it.img||""; $("#lbImage").style.display=it.img?"":"none";
  $("#lbTitle").textContent=it.title||"（未命名）";
  $("#lbPlatform").textContent=it.platform||"未填平台";
  $("#lbType").textContent=it.design_type||"未分类";
  $("#lbHoliday").textContent=((it.year||"")+" "+(it.holiday||"")).trim()||"未标年份";
  var hasEv=it.evidence_type && it.evidence_type!=="无";
  $("#lbEvidence").className="evidence-card"+(hasEv&&it.evidence_value?"":" empty-ev");
  $("#lbEvidence").innerHTML = hasEv
    ? '<div class="ec-k">'+esc(it.evidence_type)+'</div><div class="ec-v">'+esc(it.evidence_value||"—")+'</div>'+(it.evidence_note?'<div class="ec-n">'+esc(it.evidence_note)+'</div>':"")
    : '<div class="ec-k">证据</div><div class="ec-v">暂无</div><div class="ec-n">'+(it.evidence_note?esc(it.evidence_note):"建议补销量 / 点赞 / 收藏 / 转发数")+'</div>';
  var ltier=it.tier||0;var lec=ltier>=5?"#1c6b52":ltier===4?"#2f9e74":ltier===3?"#b45309":ltier===2?"#d97706":ltier===1?"#8c857a":"#b9b2a8";
  $("#lbMeter").innerHTML = ltier ? ('<span class="lbl" style="margin:0 8px 0 0">证据强度</span>'+function(){var s="";for(var k=1;k<=5;k++){s+='<span class="dot'+(k<=ltier?" on":"")+'"'+(k<=ltier?' style="background:'+lec+'"':"")+'></span>';}return s;}()+'<span class="lbl">'+ltier+'/5</span>') : '';
  var meta=[["归节日理由",it.holiday_reason],["材质",it.material],["颜色",it.color],["组成",it.composition],["品牌",it.brand],["ASIN",it.asin],["价格",it.price],["采集人",it.collected_by],["采集时间",it.collected_at],["尺寸",it.width?(it.width+"×"+it.height):""]].filter(function(r){return r[1];});
  $("#lbMeta").innerHTML=meta.map(function(r){return '<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>';}).join("");
  $("#lbTags").innerHTML=(it.tags||"").split(/[,，\s]+/).filter(Boolean).map(function(t){return '<span class="tag">#'+esc(t)+'</span>';}).join("");
  $("#lbNote").textContent=it.note||""; $("#lbNote").hidden=!it.note;
  $("#lbSource").href=it.source_url||"#"; $("#lbSource").style.display=it.source_url?"":"none";
  $("#lightbox").hidden=false;
}
function resetFilters(){
  state.filters={year:"",holiday:"",platform:"",design_type:"",evidence_type:"",collected_by:"",month:"",q:"",has_evidence:false,pending:false};
  $("#searchInput").value="";$("#evidenceOnly").checked=false;$("#pendingOnly").checked=false;
  buildScope();refresh();
}
function bind(){
  document.addEventListener("click",function(e){
    var sb=e.target.closest("[data-scope]");
    if(sb){state.filters[sb.dataset.scope]=sb.dataset.v;buildScope();refresh();return;}
    var fb=e.target.closest("[data-filter]");
    if(fb){var k=fb.dataset.filter;state.filters[k]=state.filters[k]===fb.dataset.v?"":fb.dataset.v;refresh();return;}
    var card=e.target.closest(".card");
    if(card){openLightbox(Number(card.dataset.id));return;}
    if(e.target.closest("[data-close]")){$$(".modal").forEach(function(m){m.hidden=true;});}
  });
  var st; $("#searchInput").addEventListener("input",function(e){clearTimeout(st);st=setTimeout(function(){state.filters.q=e.target.value.trim();refresh();},260);});
  $("#sortSelect").addEventListener("change",function(e){state.sort=e.target.value;refresh();});
  $("#evidenceOnly").addEventListener("change",function(e){state.filters.has_evidence=e.target.checked;refresh();});
  $("#pendingOnly").addEventListener("change",function(e){state.filters.pending=e.target.checked;refresh();});
  $("#btnReset").addEventListener("click",resetFilters);
  if($("#emptyReset"))$("#emptyReset").addEventListener("click",resetFilters);
  $$(".density button").forEach(function(b){b.addEventListener("click",function(){$$(".density button").forEach(function(x){x.classList.remove("active");});b.classList.add("active");state.density=b.dataset.density;renderGrid();});});
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){$$(".modal").forEach(function(m){m.hidden=true;});return;}
    if($("#lightbox").hidden||!state.items.length)return;
    var idx=state.items.findIndex(function(x){return x.id===state.current.id;});
    if(e.key==="ArrowRight"&&idx<state.items.length-1)openLightbox(state.items[idx+1].id);
    if(e.key==="ArrowLeft"&&idx>0)openLightbox(state.items[idx-1].id);
  });
}
buildScope(); bind(); refresh();
